<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pacey drink mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9A9AA0}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 24px; background: #1A1A1C; color: #FFFFFF; font-family: Outfit, system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Summary.dc.html" style="height: 44px; padding: 0 18px; border-radius: 22px; background: #262628; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; text-decoration: none">End night</a>
    <a href="Help.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; background: #262628; color: #FF9B8F; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg>
      Need help?
    </a>
  </div>

  <div style="font-size: 15px; font-weight: 500; color: #9A9AA0">22:40 · home by 01:30</div>

  <sc-if value="{{notReached}}" hint-placeholder-val="{{true}}">
    <div style="font-size: 36px; font-weight: 800; line-height: 1.05; letter-spacing: -0.8px">Nice and <span style="color: #6EE7C1">steady</span></div>
  </sc-if>
  <sc-if value="{{reached}}" hint-placeholder-val="{{false}}">
    <div style="font-size: 36px; font-weight: 800; line-height: 1.05; letter-spacing: -0.8px">Plan <span style="color: #FF8A3D">reached</span></div>
  </sc-if>

  <div style="background: #262628; border-radius: 26px; padding: 16px 20px; display: flex; align-items: center; gap: 24px">
    <div style="position: relative; width: 96px; height: 120px; flex-shrink: 0">
      <div style="position: absolute; inset: 3px; clip-path: polygon(0 0, 100% 0, 86% 100%, 14% 100%); background: #2F2F32">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{fillH}}; background: {{accent}}; transition: height 0.4s ease, background 0.3s ease"></div>
      </div>
      <svg width="96" height="120" viewBox="0 0 96 120" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 0; top: 0"><path d="M3 3L15.6 117H80.4L93 3"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 56px; font-weight: 800; line-height: 1">{{drinks}}</div>
      <div style="font-size: 17px; font-weight: 600; color: #9A9AA0">of {{plan}} drinks</div>
    </div>
  </div>

  <sc-if value="{{reached}}" hint-placeholder-val="{{false}}">
    <div style="background: #262628; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 20px; font-weight: 700; color: #FF8A3D">You've reached your plan</div>
      <div style="font-size: 16px; color: #B8B8BE">Switch to water from here.</div>
    </div>
  </sc-if>
  <sc-if value="{{notReached}}" hint-placeholder-val="{{true}}">
    <div style="background: #262628; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 15px; font-weight: 600; color: #9A9AA0">Your next drink fits your plan in</div>
      <div style="font-size: 44px; font-weight: 800; line-height: 1">{{countdown}}</div>
      <div style="height: 10px; border-radius: 5px; background: #353538; overflow: hidden">
        <div style="height: 10px; width: 40%; border-radius: 5px; background: linear-gradient(90deg, #6EE7C1, #5CC8F5)"></div>
      </div>
    </div>
  </sc-if>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #262628; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; font-weight: 600; color: #9A9AA0">Water</div>
      <div style="font-size: 22px; font-weight: 800; color: #5CC8F5">{{water}}</div>
    </div>
    <div style="background: #262628; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; font-weight: 600; color: #9A9AA0">Since last drink</div>
      <div style="font-size: 22px; font-weight: 800">{{sinceLast}}</div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button onClick="{{addWater}}" style="height: 62px; border-radius: 31px; border: none; background: {{waterBg}}; color: {{waterFg}}; font-family: Outfit, sans-serif; font-size: 18px; font-weight: 700; cursor: pointer">+ Water</button>
    <button onClick="{{addDrink}}" style="height: 62px; border-radius: 31px; border: none; background: {{drinkBg}}; color: {{drinkFg}}; font-family: Outfit, sans-serif; font-size: 18px; font-weight: 700; cursor: pointer">+ Drink</button>
  </div>

  <button style="min-height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; gap: 8px; color: #FFFFFF; font-family: Outfit, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16h14"></path><path d="M6 16l1.6-5.5h8.8L18 16"></path><circle cx="8" cy="17.5" r="1.8"></circle><circle cx="16" cy="17.5" r="1.8"></circle></svg>
    Ride home
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { drinks: 2, plan: 4, water: 1, sinceLast: '25 min' }; }
  renderVals() {
    const s = this.state;
    const reached = s.drinks >= s.plan;
    return {
      drinks: s.drinks,
      plan: s.plan,
      water: s.water,
      sinceLast: s.sinceLast,
      countdown: '19 min',
      reached: reached,
      notReached: !reached,
      fillH: Math.min(100, Math.round(s.drinks / s.plan * 100)) + '%',
      accent: reached ? '#FF8A3D' : '#6EE7C1',
      // Once the plan is reached, water becomes the main button and + Drink steps back.
      waterBg: reached ? '#5CC8F5' : '#262628',
      waterFg: reached ? '#1A1A1C' : '#5CC8F5',
      drinkBg: reached ? '#353538' : '#6EE7C1',
      drinkFg: reached ? '#FFFFFF' : '#1A1A1C',
      addDrink: () => this.setState({ drinks: Math.min(12, s.drinks + 1), sinceLast: 'Just now' }),
      addWater: () => this.setState({ water: s.water + 1 })
    };
  }
}
</script>
</body>
</html>
