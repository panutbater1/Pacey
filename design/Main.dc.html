<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pacey home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9A9AA0}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; background: #1A1A1C; color: #FFFFFF; font-family: Outfit, system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 38px; height: 38px; border-radius: 12px; background: #6EE7C1; color: #1A1A1C; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg>
      </div>
      <div style="font-weight: 700; font-size: 24px; letter-spacing: -0.3px">pacey</div>
    </div>
    <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #262628; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 15px; font-weight: 500; color: #9A9AA0">Friday evening</div>
    <div style="font-size: 38px; font-weight: 800; line-height: 1.05; letter-spacing: -0.8px">Going out <span style="color: #6EE7C1">tonight?</span></div>
  </div>

  <div style="background: #262628; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 16px">
    <div style="font-size: 15px; font-weight: 600">Tonight's plan</div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: #353538; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l-1.5 17h-7z"></path><path d="M7.5 8h9"></path></svg>
        </div>
        <div style="font-size: 16px; font-weight: 600">Drinks</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <button aria-label="One less drink" onClick="{{less}}" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #353538; color: #FFFFFF; font-size: 22px; cursor: pointer">−</button>
        <div style="font-size: 30px; font-weight: 800; width: 26px; text-align: center">{{drinks}}</div>
        <button aria-label="One more drink" onClick="{{more}}" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #353538; color: #FFFFFF; font-size: 22px; cursor: pointer">+</button>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: #353538; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
        </div>
        <div style="font-size: 16px; font-weight: 600">Home by</div>
      </div>
      <div style="font-size: 17px; font-weight: 700">01:30</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: #353538; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16h14"></path><path d="M6 16l1.6-5.5h8.8L18 16"></path><circle cx="8" cy="17.5" r="1.8"></circle><circle cx="16" cy="17.5" r="1.8"></circle></svg>
        </div>
        <div style="font-size: 16px; font-weight: 600">Getting home</div>
      </div>
      <div style="font-size: 17px; font-weight: 700">Taxi</div>
    </div>
  </div>

  <a href="Drink.dc.html" style="height: 62px; border-radius: 31px; background: #6EE7C1; color: #1A1A1C; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Start my night</a>

  <div style="background: #262628; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
    <div style="width: 44px; height: 44px; border-radius: 14px; background: #353538; color: #6EE7C1; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 16px; font-weight: 600">Last Saturday</div>
      <div style="font-size: 14px; color: #9A9AA0">Stuck to your plan · 3 of 4 drinks</div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="Help.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #FF9B8F; font-size: 16px; font-weight: 600; text-decoration: none">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg>
    Need help?
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { drinks: 4 }; }
  renderVals() {
    return {
      drinks: this.state.drinks,
      less: () => this.setState({ drinks: Math.max(1, this.state.drinks - 1) }),
      more: () => this.setState({ drinks: Math.min(12, this.state.drinks + 1) })
    };
  }
}
</script>
</body>
</html>
