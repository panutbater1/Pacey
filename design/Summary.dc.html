<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pacey night summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9A9AA0}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; background: #1A1A1C; color: #FFFFFF; font-family: Outfit, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
  <div style="font-size: 15px; font-weight: 500; color: #9A9AA0">Friday · 21:05 to 01:10</div>

  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
    <div style="width: 60px; height: 60px; border-radius: 18px; background: #6EE7C1; color: #1A1A1C; display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
    </div>
    <div style="font-size: 36px; font-weight: 800; line-height: 1.05; letter-spacing: -0.8px">You stuck to your <span style="color: #6EE7C1">plan</span></div>
    <div style="font-size: 17px; color: #B8B8BE; line-height: 1.45">4 of 4 drinks, nicely spread out. Have a glass of water before bed.</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <div style="background: #262628; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; font-weight: 600; color: #9A9AA0">Drinks</div>
      <div style="font-size: 24px; font-weight: 800">4</div>
    </div>
    <div style="background: #262628; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; font-weight: 600; color: #9A9AA0">Water</div>
      <div style="font-size: 24px; font-weight: 800">3</div>
    </div>
    <div style="background: #262628; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; font-weight: 600; color: #9A9AA0">Pace</div>
      <div style="font-size: 24px; font-weight: 800">1/hr</div>
    </div>
  </div>

  <div style="background: #262628; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 15px; font-weight: 600">Your night, hour by hour</div>
    <div style="display: flex; align-items: flex-end; gap: 10px; height: 100px">
      <sc-for list="{{hours}}" as="h" hint-placeholder-count="5">
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end">
          <div style="width: 100%; display: flex; flex-direction: column; gap: 4px">
            <div style="height: {{h.drinkH}}; background: #6EE7C1; border-radius: 10px"></div>
            <div style="height: {{h.waterH}}; background: #5CC8F5; border-radius: 10px"></div>
          </div>
          <div style="font-size: 12px; color: #9A9AA0">{{h.label}}</div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 14px; font-size: 13px; color: #9A9AA0">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #6EE7C1"></span>Drinks</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #5CC8F5"></span>Water</span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="background: #262628; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 16px; font-weight: 700">Getting home?</div>
      <div style="font-size: 14px; color: #9A9AA0">Don't drive tonight</div>
    </div>
    <button style="height: 44px; padding: 0 18px; border-radius: 22px; border: none; background: #353538; color: #FFFFFF; font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Book a taxi</button>
  </div>

  <a href="Main.dc.html" style="height: 60px; border-radius: 30px; background: #6EE7C1; color: #1A1A1C; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Done</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      hours: [
        { label: '21:00', drinkH: '22px', waterH: '22px' },
        { label: '22:00', drinkH: '22px', waterH: '22px' },
        { label: '23:00', drinkH: '22px', waterH: '0px' },
        { label: '00:00', drinkH: '22px', waterH: '22px' },
        { label: '01:00', drinkH: '0px', waterH: '0px' }
      ]
    };
  }
}
</script>
</body>
</html>
