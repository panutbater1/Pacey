<html lang="en">

<title>Pacey</title>
<style>
  @font-face { font-family: 'Outfit'; font-weight: 400; src: url('fonts/Outfit-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'Outfit'; font-weight: 500; src: url('fonts/Outfit-Medium.ttf') format('truetype'); }
  @font-face { font-family: 'Outfit'; font-weight: 600; src: url('fonts/Outfit-SemiBold.ttf') format('truetype'); }
  @font-face { font-family: 'Outfit'; font-weight: 700; src: url('fonts/Outfit-Bold.ttf') format('truetype'); }
  @font-face { font-family: 'Outfit'; font-weight: 800; src: url('fonts/Outfit-ExtraBold.ttf') format('truetype'); }

  html, body { margin: 0; height: 100%; background: #0E0E10; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Outfit, system-ui, sans-serif; }

  /* The phone: a black body around a 390 x 844 screen. */
  .phone {
    width: 390px; height: 844px; padding: 12px; border-radius: 56px; background: #000;
    box-shadow: 0 0 0 2px #2A2A2E, 0 24px 60px rgba(0, 0, 0, 0.6);
    -webkit-app-region: drag;
  }
  #screen {
    width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: #1A1A1C;
    -webkit-app-region: no-drag;
  }
</style>
</head>
<body>
  <div class="phone"><div id="screen" role="application" aria-label="Pacey"></div></div>
  <script src="../node_modules/react/umd/react.production.min.js"></script>
  <script src="../node_modules/react-dom/umd/react-dom.production.min.js"></script>
  <script src="generated.js"></script>
  <script src="runtime.js"></script>
</body>
